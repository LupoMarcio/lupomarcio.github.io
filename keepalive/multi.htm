<!doctype html>
<!-- https://yourname.github.io/keepalive/multi.htm?src=<encoded URL 1>&src=<encoded URL 2> -->
<html>
<head>
<style>
  html, body { margin:0; background:transparent; overflow:hidden; }
  iframe { position:absolute; inset:0; width:100vw; height:100vh;
           border:0; background:transparent; }
</style>
</head>
<body>
<script>
  for (const src of new URLSearchParams(location.search).getAll('src')) {
    const f = document.createElement('iframe');
    f.allow = 'autoplay; encrypted-media';
    f.src = src;
    document.body.appendChild(f);
  }

  const ctx = new AudioContext();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.value = 20;
  gain.gain.value = 0.001;
  osc.connect(gain).connect(ctx.destination);
  osc.start();
</script>
</body>
</html>
